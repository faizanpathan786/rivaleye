# Docker-based deploy: build in cloud (no disk space issues), deploy to VM

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rivaleye:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rivaleye:$COMMIT_SHA'
      - '.'
    timeout: '3600s'

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/rivaleye'

  # Step 3: Deploy to VM (pull image and restart)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh faizan514pathan@rivaleye-server \
          --zone=us-central1-a \
          --tunnel-through-iap \
          --quiet \
          --command="bash -lc 'cd /home/faizan514pathan/rivaleye-v3 && bash deploy-docker.sh'"

timeout: '3600s'

options:
  logging: CLOUD_LOGGING_ONLY
