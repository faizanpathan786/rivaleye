# Direct deployment: pull code to VM and rebuild
steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh faizan514pathan@rivaleye-server \
          --zone=us-central1-a \
          --tunnel-through-iap \
          --quiet \
          --command="bash -lc 'cd /home/faizan514pathan/rivaleye-v3 && rm -f deploy-docker.sh && git reset --hard HEAD && git pull origin main && pnpm install && pnpm exec turbo run build --concurrency=1 && pm2 restart all && pm2 save'"

timeout: '7200s'

options:
  logging: CLOUD_LOGGING_ONLY
