# Deploys to the rivaleye-server Compute Engine VM over IAP-tunneled SSH.
# Runs as the trigger's service account (Compute Engine default SA), which has
# Compute Admin + Service Account User. If the IAP tunnel is rejected, grant
# that SA roles/iap.tunnelResourceAccessor.
steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh faizan514pathan@rivaleye-server --zone=us-central1-a --tunnel-through-iap --quiet --command="bash -lc 'cd /home/faizan514pathan/rivaleye-v3 && git pull origin main && pnpm install && pnpm build && pm2 restart all'"

# The heavy work (pnpm install/build) runs on the VM, so the build machine
# itself stays idle — default machine type is fine.
timeout: '1800s'

options:
  logging: CLOUD_LOGGING_ONLY
