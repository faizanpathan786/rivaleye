services:
  postgres:
    image: postgres:16-alpine
    container_name: rivaleye-postgres
    environment:
      POSTGRES_USER: rivaleye
      POSTGRES_PASSWORD: rivaleye
      POSTGRES_DB: rivaleye
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivaleye -d rivaleye"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rivaleye-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
